global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:18300
        labels:
          service: vllm

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: dgx-spark
