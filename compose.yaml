name: dgx-spark-observability

services:
  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dgx_spark_vllm_grafana_v1.json
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources/prometheus.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml:ro
      - ./observability/grafana/provisioning/dashboards/dgx-spark.yaml:/etc/grafana/provisioning/dashboards/dgx-spark.yaml:ro
      - ./Grafana_Dashboards/vllm_25.1/dgx_spark_vllm_grafana_v1.yaml:/var/lib/grafana/dashboards/dgx_spark_vllm_grafana_v1.json:ro

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)
      # The GB10 firmware-backed cpufreq reads can block, which hangs scrapes and
      # exhausts node-exporter's request slots (HTTP 503 / scrape timeouts).
      - --no-collector.cpufreq
    pid: host
    volumes:
      - /:/host:ro,rslave

volumes:
  grafana-data:
  prometheus-data:
